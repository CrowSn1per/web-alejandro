backend:
  name: git-gateway
  branch: main

locale: "es"

# Las imágenes y archivos que subas desde el panel se guardan en la carpeta "images"
media_folder: "images"
public_folder: "/images"

collections:
  - name: "web"
    label: "Contenido de la web"
    files:
      - name: "datos"
        label: "Datos de la web"
        file: "datos.json"
        fields:
          # ---------- AJUSTES GENERALES ----------
          - label: "Ajustes generales (título, descripción y favicon)"
            name: "ajustes"
            widget: "object"
            collapsed: true
            fields:
              - label: "Título de la web"
                name: "titulo_web"
                widget: "string"
                default: "Alejandro Robaina"
                hint: "Es el texto de la pestaña del navegador y el título que muestran los buscadores."
              - label: "Descripción para buscadores"
                name: "descripcion_web"
                widget: "text"
                required: false
                hint: "Frase breve (unos 150 caracteres) que aparece bajo el título en Google."
              - label: "Favicon / Logo del navegador"
                name: "favicon"
                widget: "image"
                required: false
                hint: "Imagen cuadrada, PNG a ser posible, de al menos 192×192 px (ideal 512×512). Se ve en la pestaña del navegador."

          # ---------- ORDEN DE LOS APARTADOS ----------
          - label: "Orden de los apartados"
            name: "orden_secciones"
            widget: "list"
            label_singular: "apartado"
            collapsed: true
            hint: "Arrastra para reordenar. Para ocultar un apartado, bórralo de la lista; para mostrarlo, añádelo. «Descargas» solo aparece si tiene archivos. El menú se ajusta solo."
            field:
              label: "Apartado"
              name: "apartado"
              widget: "select"
              options:
                - { label: "Biografía", value: "biografia" }
                - { label: "Conciertos", value: "conciertos" }
                - { label: "Repertorio", value: "repertorio" }
                - { label: "Media (vídeos y galería)", value: "media" }
                - { label: "Descargas", value: "descargas" }
                - { label: "Contacto", value: "contacto" }

          # ---------- INICIO (HERO) ----------
          - label: "Inicio (portada)"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - label: "Subtítulo superior"
                name: "subtitulo_superior"
                widget: "string"
                hint: "Línea pequeña sobre el titular. Ejemplo: Música barroca · Antigua · Lírica"
              - label: "Subtítulo descriptivo"
                name: "subtitulo_descriptivo"
                widget: "text"
                hint: "Frase bajo el titular principal."
              - label: "Imagen de fondo"
                name: "imagen_fondo"
                widget: "image"
                required: false
                hint: "Mejor horizontal y de alta calidad (mínimo 1920 px de ancho). Se oscurece automáticamente."
              - label: "Encuadre de la imagen de fondo"
                name: "imagen_fondo_posicion"
                widget: "select"
                default: "center center"
                required: false
                hint: "Qué parte de la foto queda visible cuando se recorta (por ejemplo, «Arriba · centro» si no quieres perder la cabeza)."
                options:
                  - { label: "Arriba · izquierda", value: "left top" }
                  - { label: "Arriba · centro", value: "center top" }
                  - { label: "Arriba · derecha", value: "right top" }
                  - { label: "Centro · izquierda", value: "left center" }
                  - { label: "Centro", value: "center center" }
                  - { label: "Centro · derecha", value: "right center" }
                  - { label: "Abajo · izquierda", value: "left bottom" }
                  - { label: "Abajo · centro", value: "center bottom" }
                  - { label: "Abajo · derecha", value: "right bottom" }
              - label: "Zoom de la imagen de fondo (%)"
                name: "imagen_fondo_zoom"
                widget: "number"
                value_type: "int"
                min: 100
                max: 300
                step: 5
                default: 100
                required: false
                hint: "100 = sin zoom. Aumenta para acercar; el zoom se centra en el punto de encuadre elegido. La foto nunca se deforma."

          # ---------- BIOGRAFÍA ----------
          - label: "Título de la biografía"
            name: "biografia_titulo"
            widget: "string"

          - label: "Foto de biografía"
            name: "foto_biografia"
            widget: "image"
            required: false
            hint: "Fotografía que aparece junto a tu biografía. Se muestra en formato vertical (4:5)."
          - label: "Encuadre de la foto de biografía"
            name: "foto_biografia_posicion"
            widget: "select"
            default: "center center"
            required: false
            hint: "Qué parte de la foto queda visible cuando se recorta (por ejemplo, «Arriba · centro» si no quieres perder la cabeza)."
            options:
              - { label: "Arriba · izquierda", value: "left top" }
              - { label: "Arriba · centro", value: "center top" }
              - { label: "Arriba · derecha", value: "right top" }
              - { label: "Centro · izquierda", value: "left center" }
              - { label: "Centro", value: "center center" }
              - { label: "Centro · derecha", value: "right center" }
              - { label: "Abajo · izquierda", value: "left bottom" }
              - { label: "Abajo · centro", value: "center bottom" }
              - { label: "Abajo · derecha", value: "right bottom" }
          - label: "Zoom de la foto de biografía (%)"
            name: "foto_biografia_zoom"
            widget: "number"
            value_type: "int"
            min: 100
            max: 300
            step: 5
            default: 100
            required: false
            hint: "100 = sin zoom. Aumenta para acercar; el zoom se centra en el punto de encuadre elegido. La foto nunca se deforma."

          - label: "Párrafos de biografía"
            name: "biografia"
            widget: "list"
            hint: "Cada elemento es un párrafo. Puedes añadir, borrar y reordenar."
            field:
              label: "Párrafo"
              name: "parrafo"
              widget: "text"

          - label: "Recuadros de la biografía (3)"
            name: "estadisticas"
            widget: "list"
            label_singular: "recuadro"
            min: 3
            max: 3
            summary: "{{fields.valor}} · {{fields.etiqueta}}"
            hint: "Los tres recuadros bajo la biografía. Mejor textos cortos."
            fields:
              - label: "Texto grande"
                name: "valor"
                widget: "string"
                hint: "Ejemplo: Do"
              - label: "Texto pequeño"
                name: "etiqueta"
                widget: "string"
                hint: "Ejemplo: Sobreagudo"

          # ---------- CONCIERTOS ----------
          - label: "Conciertos"
            name: "conciertos"
            widget: "list"
            label_singular: "concierto"
            summary: "{{fields.dia}} {{fields.mes_anio}} · {{fields.titulo}}"
            hint: "Añade, borra o reordena los conciertos que aparecen en la web."
            fields:
              - label: "Día"
                name: "dia"
                widget: "string"
                hint: "Ejemplo: 12"
              - label: "Mes y año"
                name: "mes_anio"
                widget: "string"
                hint: "Ejemplo: Dic 2026"
              - label: "Título"
                name: "titulo"
                widget: "string"
              - label: "Lugar"
                name: "lugar"
                widget: "string"
                hint: "Ejemplo: Teatro Cuyás · Las Palmas de Gran Canaria"
              - label: "Hora"
                name: "hora"
                widget: "string"
                hint: "Ejemplo: 20:00 h"
              - label: "Enlace de venta de entradas"
                name: "url"
                widget: "string"
                required: false
                hint: "URL directa de compra (https://...). Si la rellenas aparece el botón «Comprar entrada»."
              - label: "Si no hay enlace, mostrar"
                name: "aviso"
                widget: "select"
                default: "ninguno"
                required: false
                hint: "Solo se usa cuando el enlace está vacío."
                options:
                  - { label: "Nada (sin botón)", value: "ninguno" }
                  - { label: "Entrada libre", value: "libre" }
                  - { label: "Próximamente", value: "proximamente" }

          # ---------- REPERTORIO ----------
          - label: "Repertorio"
            name: "repertorio"
            widget: "object"
            collapsed: true
            fields:
              - label: "Texto introductorio"
                name: "intro"
                widget: "text"
              - label: "Tarjetas (3)"
                name: "tarjetas"
                widget: "list"
                label_singular: "tarjeta"
                min: 3
                max: 3
                summary: "{{fields.titulo}}"
                fields:
                  - label: "Título"
                    name: "titulo"
                    widget: "string"
                  - label: "Descripción"
                    name: "descripcion"
                    widget: "text"

          # ---------- MEDIA ----------
          - label: "Vídeos de YouTube"
            name: "videos"
            widget: "list"
            label_singular: "vídeo"
            summary: "{{fields.titulo}}"
            hint: "Añade, borra o reordena los vídeos de la sección Media."
            fields:
              - label: "Título"
                name: "titulo"
                widget: "string"
              - label: "ID del vídeo de YouTube"
                name: "id"
                widget: "string"
                required: false
                hint: "Es la parte final de la URL: youtube.com/watch?v=ESTE_ID (11 caracteres). También sirve pegar la URL completa."

          - label: "Galería de fotos (Media)"
            name: "galeria"
            widget: "list"
            label_singular: "foto"
            summary: "{{fields.descripcion}}"
            hint: "Fotos de actuaciones bajo los vídeos. Se muestran cuadradas, en filas de 4."
            fields:
              - label: "Foto"
                name: "foto"
                widget: "image"
                required: false
                hint: "Se recorta en formato cuadrado: usa el encuadre y el zoom de abajo para elegir la zona."
              - label: "Descripción de la foto"
                name: "descripcion"
                widget: "string"
                required: false
                hint: "Texto alternativo para accesibilidad. Ejemplo: Recital en el Teatro Cuyás."
              - label: "Encuadre de esta foto"
                name: "posicion"
                widget: "select"
                default: "center center"
                required: false
                hint: "Qué parte de la foto queda visible cuando se recorta (por ejemplo, «Arriba · centro» si no quieres perder la cabeza)."
                options:
                  - { label: "Arriba · izquierda", value: "left top" }
                  - { label: "Arriba · centro", value: "center top" }
                  - { label: "Arriba · derecha", value: "right top" }
                  - { label: "Centro · izquierda", value: "left center" }
                  - { label: "Centro", value: "center center" }
                  - { label: "Centro · derecha", value: "right center" }
                  - { label: "Abajo · izquierda", value: "left bottom" }
                  - { label: "Abajo · centro", value: "center bottom" }
                  - { label: "Abajo · derecha", value: "right bottom" }
              - label: "Zoom de esta foto (%)"
                name: "zoom"
                widget: "number"
                value_type: "int"
                min: 100
                max: 300
                step: 5
                default: 100
                required: false
                hint: "100 = sin zoom. Aumenta para acercar; el zoom se centra en el punto de encuadre elegido. La foto nunca se deforma."

          # ---------- DESCARGAS ----------
          - label: "Descargas (dossier y currículum)"
            name: "descargas"
            widget: "object"
            collapsed: true
            fields:
              - label: "Título de la sección"
                name: "titulo"
                widget: "string"
                default: "Dossier y Currículum"
              - label: "Texto introductorio"
                name: "intro"
                widget: "text"
                required: false
              - label: "Archivos"
                name: "archivos"
                widget: "list"
                label_singular: "archivo"
                required: false
                summary: "{{fields.titulo}}"
                hint: "La sección solo aparece en la web cuando hay al menos un archivo."
                fields:
                  - label: "Título"
                    name: "titulo"
                    widget: "string"
                    hint: "Ejemplo: Currículum artístico"
                  - label: "Descripción"
                    name: "descripcion"
                    widget: "string"
                    required: false
                    hint: "Ejemplo: Actualizado a noviembre de 2026"
                  - label: "Archivo"
                    name: "archivo"
                    widget: "file"
                    hint: "PDF recomendado (también Word, ZIP, imágenes o audio)."

          # ---------- CONTACTO ----------
          - label: "Contacto"
            name: "contacto"
            widget: "object"
            collapsed: true
            fields:
              - label: "Párrafo introductorio"
                name: "intro"
                widget: "text"
              - label: "Correo electrónico"
                name: "email"
                widget: "string"
                hint: "También es el destino del formulario de contacto."
              - label: "Facebook"
                name: "facebook"
                widget: "string"
                required: false
                hint: "URL completa (https://...). Si lo dejas vacío, el icono se oculta."
              - label: "Instagram"
                name: "instagram"
                widget: "string"
                required: false
                hint: "URL completa (https://...). Si lo dejas vacío, el icono se oculta."
              - label: "YouTube"
                name: "youtube"
                widget: "string"
                required: false
                hint: "URL completa de tu canal. También se usa en «Ver más en YouTube»."

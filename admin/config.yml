backend:
  name: git-gateway
  branch: main

locale: "es"

# Las imágenes que subas desde el panel se guardan en la carpeta "images"
media_folder: "images"
public_folder: "/images"

collections:
  - name: "web"
    label: "Contenido de la web"
    files:
      - name: "datos"
        label: "Datos de la web"
        file: "datos.json"
        fields:
          # ---------- INICIO (HERO) ----------
          - label: "Inicio (portada)"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - label: "Subtítulo superior"
                name: "subtitulo_superior"
                widget: "string"
                hint: "Línea pequeña sobre el titular. Ejemplo: Música barroca · Antigua · Lírica"
              - label: "Subtítulo descriptivo"
                name: "subtitulo_descriptivo"
                widget: "text"
                hint: "Frase bajo el titular principal."
              - label: "Imagen de fondo"
                name: "imagen_fondo"
                widget: "image"
                required: false
                hint: "Mejor horizontal y de alta calidad (mínimo 1920 px de ancho). Se oscurece automáticamente."

          # ---------- BIOGRAFÍA ----------
          - label: "Título de la biografía"
            name: "biografia_titulo"
            widget: "string"

          - label: "Foto de biografía"
            name: "foto_biografia"
            widget: "image"
            required: false
            hint: "Fotografía que aparece junto a tu biografía. Formato vertical (4:5) recomendado."

          - label: "Párrafos de biografía"
            name: "biografia"
            widget: "list"
            hint: "Cada elemento es un párrafo. Puedes añadir, borrar y reordenar."
            field:
              label: "Párrafo"
              name: "parrafo"
              widget: "text"

          - label: "Recuadros de la biografía (3)"
            name: "estadisticas"
            widget: "list"
            label_singular: "recuadro"
            min: 3
            max: 3
            summary: "{{fields.valor}} · {{fields.etiqueta}}"
            hint: "Los tres recuadros bajo la biografía. Mejor textos cortos."
            fields:
              - label: "Texto grande"
                name: "valor"
                widget: "string"
                hint: "Ejemplo: Do"
              - label: "Texto pequeño"
                name: "etiqueta"
                widget: "string"
                hint: "Ejemplo: Sobreagudo"

          # ---------- CONCIERTOS ----------
          - label: "Conciertos"
            name: "conciertos"
            widget: "list"
            label_singular: "concierto"
            summary: "{{fields.dia}} {{fields.mes_anio}} · {{fields.titulo}}"
            hint: "Añade, borra o reordena los conciertos que aparecen en la web."
            fields:
              - label: "Día"
                name: "dia"
                widget: "string"
                hint: "Ejemplo: 12"
              - label: "Mes y año"
                name: "mes_anio"
                widget: "string"
                hint: "Ejemplo: Dic 2026"
              - label: "Título"
                name: "titulo"
                widget: "string"
              - label: "Lugar"
                name: "lugar"
                widget: "string"
                hint: "Ejemplo: Teatro Cuyás · Las Palmas de Gran Canaria"
              - label: "Hora"
                name: "hora"
                widget: "string"
                hint: "Ejemplo: 20:00 h"

          # ---------- REPERTORIO ----------
          - label: "Repertorio"
            name: "repertorio"
            widget: "object"
            collapsed: true
            fields:
              - label: "Texto introductorio"
                name: "intro"
                widget: "text"
              - label: "Tarjetas (3)"
                name: "tarjetas"
                widget: "list"
                label_singular: "tarjeta"
                min: 3
                max: 3
                summary: "{{fields.titulo}}"
                fields:
                  - label: "Título"
                    name: "titulo"
                    widget: "string"
                  - label: "Descripción"
                    name: "descripcion"
                    widget: "text"

          # ---------- MEDIA ----------
          - label: "Vídeos de YouTube"
            name: "videos"
            widget: "list"
            label_singular: "vídeo"
            summary: "{{fields.titulo}}"
            hint: "Añade, borra o reordena los vídeos de la sección Media."
            fields:
              - label: "Título"
                name: "titulo"
                widget: "string"
              - label: "ID del vídeo de YouTube"
                name: "id"
                widget: "string"
                required: false
                hint: "Es la parte final de la URL: youtube.com/watch?v=ESTE_ID (11 caracteres). También sirve pegar la URL completa."

          - label: "Galería de fotos (Media)"
            name: "galeria"
            widget: "list"
            label_singular: "foto"
            summary: "{{fields.descripcion}}"
            hint: "Fotos de actuaciones bajo los vídeos. Se diseñó para 4 (cuadradas); si añades más, se colocan en filas de 4."
            fields:
              - label: "Foto"
                name: "foto"
                widget: "image"
                required: false
                hint: "Se recorta en formato cuadrado."
              - label: "Descripción de la foto"
                name: "descripcion"
                widget: "string"
                required: false
                hint: "Texto alternativo para accesibilidad. Ejemplo: Recital en el Teatro Cuyás."

          # ---------- CONTACTO ----------
          - label: "Contacto"
            name: "contacto"
            widget: "object"
            collapsed: true
            fields:
              - label: "Párrafo introductorio"
                name: "intro"
                widget: "text"
              - label: "Correo electrónico"
                name: "email"
                widget: "string"
                hint: "También es el destino del formulario de contacto."
              - label: "Facebook"
                name: "facebook"
                widget: "string"
                required: false
                hint: "URL completa (https://...). Si lo dejas vacío, el icono se oculta."
              - label: "Instagram"
                name: "instagram"
                widget: "string"
                required: false
                hint: "URL completa (https://...). Si lo dejas vacío, el icono se oculta."
              - label: "YouTube"
                name: "youtube"
                widget: "string"
                required: false
                hint: "URL completa de tu canal. También se usa en «Ver más en YouTube»."
